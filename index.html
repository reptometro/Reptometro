<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
    <style>
        /* Base Reset and Typography */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        body, html {
            height: 100%;
            width: 100%;
            background-color: #f4f4f4;
        }

        /* Hero Image Container */
        .hero-background {
            position: relative;
            min-height: 100vh;
            width: 100%;
            background-image: url('IMG_0082.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Navigation Overlay Container */
        .navbar {
            width: 100%;
            height: 100%;
            padding: 2.5rem 2rem;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            /* The solid background and border are removed to let the image show through */
        }

        .nav-list {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100%;
            list-style: none;
        }

        /* Stark, Geometric Button Styling */
        .nav-item a {
            display: block;
            padding: 0.75rem 1.5rem;
            background-color: #ffffff;
            color: #000000;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border: 2px solid #000000;
            border-radius: 0; /* Sharp, 90-degree corners */
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        /* High-Contrast Inversion on Hover */
        .nav-item a:hover {
            background-color: #000000;
            color: #ffffff;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .navbar {
                padding: 1.5rem 1rem;
            }
            .nav-item a {
                padding: 0.7rem 1.2rem;
                font-size: 0.75rem;
            }
        }

        @media (max-width: 480px) {
            .nav-list {
                gap: 0.5rem;
            }
            .nav-item a {
                text-align: center;
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="hero-background">
        <nav class="navbar">
            <ul class="nav-list">
                <li class="nav-item"><a href="#">Físico-Espacial</a></li>
                <li class="nav-item"><a href="#">Socioeconómico</a></li>
                <li class="nav-item"><a href="#">Ambiental</a></li>
                <li class="nav-item"><a href="#">Agua</a></li>
                <li class="nav-item"><a href="#">Historico</a></li>
                <li class="nav-item"><a href="#">Marco Regulatorio</a></li>
                <li class="nav-item"><a href="#">Storymap</a></li>
                <li class="nav-item"><a href="swipe.html">Swipe Tool</a></li>
            </ul>
        </nav>
    </div>

</body>
</html>
