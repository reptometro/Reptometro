<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
    <style>
        /* Base Reset and Typography */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        /* Two-Column Flexbox Layout */
        body, html {
            height: 100%;
            width: 100%;
            background-color: #f4f4f4;
            display: flex;
            overflow: hidden; /* Prevents scrolling if image fits viewport */
        }

        /* Left Panel (Sidebar) */
        .sidebar {
            width: 320px;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center; /* Centers the menu vertically */
            padding: 2rem;
            z-index: 10;
            border-right: 3px solid #111111; /* Strong structural division */
            flex-shrink: 0;
        }

        .nav-list {
            display: flex;
            flex-direction: column;
            list-style: none;
            gap: 1.5rem; /* Spacing matching the sketch blocks */
        }

        /* Geometric Block Buttons */
        .nav-item a {
            display: block;
            padding: 1rem 1.5rem;
            background-color: #d8d8d8; /* Light grey matching sketch placeholders */
            color: #000000;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border: 2px solid transparent; 
            border-radius: 0; /* Sharp, 90-degree corners */
            text-align: left; /* Flush-left alignment for readability */
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        /* High-Contrast Inversion on Hover */
        .nav-item a:hover {
            background-color: #000000;
            color: #ffffff;
        }

        /* Hero Image Container */
        .hero-background {
            flex-grow: 1; /* Expands to fill the remaining screen width */
            background-image: url('IMG_0082.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Mobile Responsiveness */
        @media (max-width: 900px) {
            body, html {
                flex-direction: column;
                overflow: auto;
            }
            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 3px solid #111111;
                padding: 2rem 1.5rem;
            }
            .hero-background {
                min-height: 60vh; /* Ensures image is still visible below menu */
            }
        }
    </style>
</head>
<body>

    <!-- Left Structural Panel -->
    <aside class="sidebar">
        <nav class="navbar">
            <ul class="nav-list">
                <li class="nav-item"><a href="#">Físico-Espacial</a></li>
                <li class="nav-item"><a href="#">Socioeconómico</a></li>
                <li class="nav-item"><a href="#">Ambiental</a></li>
                <li class="nav-item"><a href="#">Agua</a></li>
                <li class="nav-item"><a href="#">Historico</a></li>
                <li class="nav-item"><a href="#">Marco Regulatorio</a></li>
                <li class="nav-item"><a href="#">Storymap</a></li>
                <li class="nav-item"><a href="swipe.html">Swipe Tool</a></li>
            </ul>
        </nav>
    </aside>

    <!-- Right Map Imagery -->
    <div class="hero-background"></div>

</body>
</html>
