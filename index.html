<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Base Reset and Typography */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        /* Two-Column Flexbox Layout */
        body, html {
            min-height: 100%;
            width: 100%;
            background-color: #f4f4f4;
            display: flex;
            overflow: hidden;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
        }

        /* Left Panel (Sidebar) */
        .sidebar {
            width: 320px;
            min-height: 100vh;
            min-height: 100dvh;
            background-color: #04ADE2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 2rem;
            z-index: 10;
            border-right: 3px solid #111111;
            flex-shrink: 0;
        }

        .nav-list {
            display: flex;
            flex-direction: column;
            list-style: none;
            gap: 1.5rem;
        }

        /* Enhanced Geometric Button Styling */
        .nav-item a {
            display: block;
            padding: 1rem 1.5rem;
            background-color: #ffffff;
            color: #111111;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border: none;
            border-radius: 0;
            text-align: left;
            transition: background-color 0s, color 0s;
        }

        /* Stark Inversion on Hover */
        .nav-item a:hover, .nav-item a.active {
            background-color: #111111;
            color: #ffffff;
        }

        /* Hero Image Container */
        .hero-background {
            flex: 1;
            min-height: 100vh;
            min-height: 100dvh;
            background-image: url('IMG_0082.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            isolation: isolate;
        }

        /* Dark overlay improves contrast against the image */
        .hero-background::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.48);
            z-index: -1;
        }

        .hero-title {
            max-width: 900px;
            color: #ffffff;
            font-size: clamp(1.5rem, 3vw, 3rem);
            font-weight: 700;
            line-height: 1.2;
            text-align: center;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.9);
            position: relative;
            z-index: 1;
        }

        /* Mobile Responsiveness */
        @media (max-width: 900px) {
            body, html {
                flex-direction: column;
                overflow: auto;
            }

            .sidebar {
                width: 100%;
                min-height: auto;
                border-right: none;
                border-bottom: 3px solid #111111;
                padding: 2rem 1.5rem;
            }

            .hero-background {
                min-height: 60vh;
                min-height: 60dvh;
                flex: 1;
            }
        }
    </style>
</head>
<body>

    <!-- Left Structural Panel -->
    <aside class="sidebar">
        <nav class="navbar">
            <ul class="nav-list">
                <li class="nav-item"><a href="#">Físico-Espacial</a></li>
                <li class="nav-item"><a href="#">Socioeconómico</a></li>
                <li class="nav-item"><a href="#">Ambiental</a></li>
                <li class="nav-item"><a href="#">Agua</a></li>
                <li class="nav-item"><a href="#">Historico</a></li>
                <li class="nav-item"><a href="#">Marco Regulatorio</a></li>
                <li class="nav-item"><a href="#">Storymap</a></li>
                <li class="nav-item"><a href="swipe.html">Swipe Tool</a></li>
            </ul>
        </nav>
    </aside>

    <!-- Right Map Imagery -->
    <div class="hero-background">
        <h1 class="hero-title">Planificación a nivel de Cuenca en el Río Piedras (Quebradas Josefina y Doña Ana)</h1>
    </div>

</body>
</html>
