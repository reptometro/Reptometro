<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análisis Espacial - Swipe Tool</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        /* Base Reset and Typography */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #f4f4f4;
        }

        .map-container,
        .map {
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* Layer controls */
        .ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            display: flex;
            pointer-events: none;
        }

        .control-panel {
            background-color: #ffffff;
            border: 2px solid #000000;
            padding: 1rem;
            width: 220px;
            pointer-events: auto;
        }

        .panel-header {
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 0.75rem;
            border-bottom: 2px solid #000000;
            padding-bottom: 0.5rem;
        }

        .layer-btn {
            display: block;
            width: 100%;
            padding: 0.6rem 0.75rem;
            margin-bottom: 0.5rem;
            background-color: #ffffff;
            color: #000000;
            text-align: left;
            font-weight: 700;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            border: 2px solid #111111;
            border-radius: 0;
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .layer-btn:last-child {
            margin-bottom: 0;
        }

        .layer-btn:hover,
        .layer-btn.active {
            background-color: #111111;
            color: #ffffff;
        }

        /* FORCE SWIPE HANDLE VISIBILITY */
        .leaflet-sbs-range {
            z-index: 9999 !important; /* Forces slider thumb above all layers */
            cursor: ew-resize !important;
        }

        .leaflet-sbs-divider {
            z-index: 9998 !important; /* Forces divider line above map */
            background-color: #111111 !important; /* Matches UI border color */
            width: 4px !important;
            pointer-events: none;
        }

        @media (max-width: 600px) {
            .ui-container {
                top: 10px;
                left: 10px;
            }
            .control-panel {
                width: 180px;
                padding: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="map-container">
        <div id="map" class="map"></div>
        <div class="ui-container">
            <div class="control-panel">
                <div class="panel-header">Capa Base (Izquierda)</div>
                <button class="layer-btn left-btn active" data-layer="google">Google Satélite</button>
                <button class="layer-btn left-btn" data-layer="osm">OpenStreetMap</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/digidem/leaflet-side-by-side/leaflet-side-by-side.min.js"></script>
    <script src="https://unpkg.com/geotiff"></script>
    <script src="https://unpkg.com/georaster"></script>
    <script src="https://unpkg.com/georaster-layer-for-leaflet"></script>

    <script>
        // 1. Initialize Map
        const initialView = [18.4663, -66.1057];
        const initialZoom = 14;
        const map = L.map('map', { zoomControl: true }).setView(initialView, initialZoom);

        // 2. Define Base Layers for Left Side
        const baseLayers = {
            google: L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
                maxZoom: 20,
                subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
            }),
            osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19
            })
        };

        let historicalLayer = null;
        let currentLeft = baseLayers.google;
        let swipeControl = null;

        // Add initial left layer
        currentLeft.addTo(map);

        // 3. UI Logic for Left Panel
        function updateLeftLayer(layerKey) {
            const nextLayer = baseLayers[layerKey];
            if (!nextLayer || nextLayer === currentLeft) return;

            nextLayer.addTo(map); // Add new layer first
            map.removeLayer(currentLeft); // Remove old layer
            currentLeft = nextLayer;

            if (swipeControl) {
                swipeControl.setLeftLayers(currentLeft);
            }
        }

        document.querySelectorAll('.left-btn').forEach(button => {
            button.addEventListener('click', () => {
                document.querySelectorAll('.left-btn').forEach(item => item.classList.remove('active'));
                button.classList.add('active');
                updateLeftLayer(button.dataset.layer);
            });
        });

        // 4. Fetch and Process 1937 Historical TIFF (Right Side)
        fetch('image00002_powered_by_soar.tiff')
            .then(response => {
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return response.arrayBuffer();
            })
            .then(arrayBuffer => parseGeoraster(arrayBuffer))
            .then(georaster => {
                const noDataValue = georaster.noDataValue;

                historicalLayer = new GeoRasterLayer({
                    georaster,
                    opacity: 1,
                    resolution: 256,
                    pixelValuesToColorFn: values => {
                        const pixelValue = values[0];
                        if (
                            !Number.isFinite(pixelValue) ||
                            pixelValue < 0 ||
                            pixelValue === 256 ||
                            (Number.isFinite(noDataValue) && pixelValue === noDataValue)
                        ) {
                            return null;
                        }
                        const val = Math.max(0, Math.min(255, Math.round(pixelValue)));
                        return `rgb(${val}, ${val}, ${val})`;
                    }
                });

                // Add TIFF to map
                historicalLayer.addTo(map);

                // Initialize Swipe Tool with Left and Right layers
                swipeControl = L.control.sideBySide(currentLeft, historicalLayer).addTo(map);

                // Auto-center map on historical data
                const bounds = historicalLayer.getBounds();
                if (bounds && bounds.isValid()) {
                    map.fitBounds(bounds);
                }
            })
            .catch(error => console.error('Error loading 1937 SOAR TIFF:', error));
    </script>
</body>
</html>
