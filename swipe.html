<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análisis Espacial - Comparación</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        /* Base Reset and Typography */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #f4f4f4;
        }

        /* Two maps displayed simultaneously */
        .comparison-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        .map-panel {
            position: relative;
            width: 50%;
            height: 100%;
        }

        .map-panel + .map-panel {
            border-left: 3px solid #111111;
        }

        .map {
            height: 100%;
            width: 100%;
        }

        /* Layer controls */
        .ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }

        .control-panel {
            background-color: #ffffff;
            border: 2px solid #000000;
            padding: 1rem;
            width: 190px;
            pointer-events: auto;
        }

        .panel-header {
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 0.75rem;
            border-bottom: 2px solid #000000;
            padding-bottom: 0.5rem;
        }

        .layer-btn {
            display: block;
            width: 100%;
            padding: 0.6rem 0.75rem;
            margin-bottom: 0.5rem;
            background-color: #ffffff;
            color: #000000;
            text-align: left;
            font-weight: 700;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            border: 2px solid #1d5eff;
            border-radius: 0;
            cursor: pointer;
        }

        .layer-btn:last-child {
            margin-bottom: 0;
        }

        .layer-btn:hover,
        .layer-btn.active {
            background-color: #1d5eff;
            color: #ffffff;
        }

        @media (max-width: 600px) {
            .comparison-container {
                flex-direction: column;
            }

            .map-panel {
                width: 100%;
                height: 50%;
            }

            .map-panel + .map-panel {
                border-left: none;
                border-top: 3px solid #111111;
            }

            .ui-container {
                top: 10px;
                left: 10px;
                right: 10px;
            }

            .control-panel {
                width: 150px;
                padding: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="comparison-container">
        <section class="map-panel">
            <div id="left-map" class="map"></div>
            <div class="ui-container">
                <div class="control-panel">
                    <div class="panel-header">Capa Izquierda</div>
                    <button class="layer-btn left-btn active" data-layer="google">Google Satélite</button>
                    <button class="layer-btn left-btn" data-layer="tiff1937">1937 Histórico</button>
                </div>
            </div>
        </section>

        <section class="map-panel">
            <div id="right-map" class="map"></div>
            <div class="ui-container">
                <div class="control-panel">
                    <div class="panel-header">Capa Derecha</div>
                    <button class="layer-btn right-btn" data-layer="google">Google Satélite</button>
                    <button class="layer-btn right-btn active" data-layer="tiff1937">1937 Histórico</button>
                </div>
            </div>
        </section>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/geotiff"></script>
    <script src="https://unpkg.com/georaster"></script>
    <script src="https://unpkg.com/georaster-layer-for-leaflet"></script>

    <script>
        const initialView = [18.4663, -66.1057];
        const initialZoom = 14;

        const leftMap = L.map('left-map', { zoomControl: true }).setView(initialView, initialZoom);
        const rightMap = L.map('right-map', { zoomControl: true }).setView(initialView, initialZoom);

        const googleLeft = L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
        });
        const googleRight = L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
        });

        googleLeft.addTo(leftMap);
        googleRight.addTo(rightMap);

        let historicalLayer;
        let currentLeft = googleLeft;
        let currentRight = null;
        let syncingMaps = false;

        // Keep both map panes synchronized while zooming or panning either one.
        function synchronize(source, target) {
            source.on('move', () => {
                if (syncingMaps) return;
                syncingMaps = true;
                target.setView(source.getCenter(), source.getZoom(), { animate: false });
                syncingMaps = false;
            });
        }

        synchronize(leftMap, rightMap);
        synchronize(rightMap, leftMap);

        function updateLayer(side, layerKey) {
            const map = side === 'left' ? leftMap : rightMap;
            const current = side === 'left' ? currentLeft : currentRight;
            const next = layerKey === 'google'
                ? (side === 'left' ? googleLeft : googleRight)
                : historicalLayer;

            if (!next || next === current) return;
            if (current) map.removeLayer(current);
            next.addTo(map);

            if (side === 'left') {
                currentLeft = next;
            } else {
                currentRight = next;
            }
        }

        document.querySelectorAll('.left-btn').forEach(button => {
            button.addEventListener('click', () => {
                document.querySelectorAll('.left-btn').forEach(item => item.classList.remove('active'));
                button.classList.add('active');
                updateLayer('left', button.dataset.layer);
            });
        });

        document.querySelectorAll('.right-btn').forEach(button => {
            button.addEventListener('click', () => {
                document.querySelectorAll('.right-btn').forEach(item => item.classList.remove('active'));
                button.classList.add('active');
                updateLayer('right', button.dataset.layer);
            });
        });

        // 1937 historical aerial image supplied by SOAR.
        fetch('image00002_powered_by_soar.tiff')
            .then(response => {
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return response.arrayBuffer();
            })
            .then(arrayBuffer => parseGeoraster(arrayBuffer))
            .then(georaster => {
                const noDataValue = georaster.noDataValue;

                historicalLayer = new GeoRasterLayer({
                    georaster,
                    opacity: 1,
                    resolution: 256,
                    // Render the single-band TIFF as grayscale RGB.
                    pixelValuesToColorFn: values => {
                        const pixelValue = values[0];

                        // Treat missing, negative, TIFF NoData, and 256 values as transparent.
                        if (
                            !Number.isFinite(pixelValue) ||
                            pixelValue < 0 ||
                            pixelValue === 256 ||
                            (Number.isFinite(noDataValue) && pixelValue === noDataValue)
                        ) {
                            return null;
                        }

                        // Clamp values to the valid RGB range before rendering.
                        const val = Math.max(0, Math.min(255, Math.round(pixelValue)));
                        return `rgb(${val}, ${val}, ${val})`;
                    }
                });

                historicalLayer.addTo(rightMap);
                currentRight = historicalLayer;

                const bounds = historicalLayer.getBounds();
                if (bounds && bounds.isValid()) {
                    leftMap.fitBounds(bounds);
                    rightMap.fitBounds(bounds);
                }
            })
            .catch(error => console.error('Error loading 1937 SOAR TIFF:', error));
    </script>
</body>
</html>
