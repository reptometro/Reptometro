<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análisis Espacial - Comparación</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #f4f4f4;
        }

        .comparison-container,
        .map {
            height: 100vh;
            width: 100vw;
        }

        .comparison-container {
            position: relative;
        }

        .ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }

        .control-panel {
            background-color: #ffffff;
            border: 2px solid #000000;
            padding: 1rem;
            width: 190px;
            pointer-events: auto;
        }

        .panel-header {
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 0.75rem;
            border-bottom: 2px solid #000000;
            padding-bottom: 0.5rem;
        }

        .layer-btn {
            display: block;
            width: 100%;
            padding: 0.6rem 0.75rem;
            margin-bottom: 0.5rem;
            background-color: #ffffff;
            color: #000000;
            text-align: left;
            font-weight: 700;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            border: 2px solid #1d5eff;
            border-radius: 0;
            cursor: pointer;
        }

        .layer-btn:last-child {
            margin-bottom: 0;
        }

        .layer-btn:hover,
        .layer-btn.active {
            background-color: #1d5eff;
            color: #ffffff;
        }

        .leaflet-sbs-divider {
            width: 4px;
            background: #111111;
        }

        .leaflet-sbs-range {
            height: 100%;
            width: 100%;
            margin: 0;
            cursor: ew-resize;
        }

        @media (max-width: 600px) {
            .ui-container {
                top: 10px;
                left: 10px;
                right: 10px;
            }

            .control-panel {
                width: 150px;
                padding: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="comparison-container">
        <div id="map" class="map"></div>
        <div class="ui-container">
            <div class="control-panel">
                <div class="panel-header">Capa Izquierda</div>
                <button class="layer-btn left-btn active" data-layer="google">Google Satélite</button>
                <button class="layer-btn left-btn" data-layer="tiff1937">1937 Histórico</button>
            </div>
            <div class="control-panel">
                <div class="panel-header">Capa Derecha</div>
                <button class="layer-btn right-btn" data-layer="google">Google Satélite</button>
                <button class="layer-btn right-btn active" data-layer="tiff1937">1937 Histórico</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-side-by-side@2.0.2/leaflet-side-by-side.js"></script>
    <script src="https://unpkg.com/geotiff"></script>
    <script src="https://unpkg.com/georaster"></script>
    <script src="https://unpkg.com/georaster-layer-for-leaflet"></script>

    <script>
        const initialView = [18.4663, -66.1057];
        const initialZoom = 14;
        const map = L.map('map', { zoomControl: true }).setView(initialView, initialZoom);

        const googleLeft = L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
        });
        const googleRight = L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
        });

        let historicalLayer = null;
        let currentLeft = googleLeft;
        let currentRight = null;
        let swipeControl = null;

        // Only add the left layer initially. Do NOT initialize the swipe tool yet.
        currentLeft.addTo(map);

        function updateLayer(side, layerKey) {
            const next = layerKey === 'google'
                ? (side === 'left' ? googleLeft : googleRight)
                : historicalLayer;

            if (!next) return false;

            // FIX 1: The layer must be added to the map before the swipe tool can clip it.
            next.addTo(map);

            if (side === 'left') {
                if (currentLeft && currentLeft !== next) map.removeLayer(currentLeft);
                currentLeft = next;
                if (swipeControl) swipeControl.setLeftLayers(currentLeft);
            } else {
                if (currentRight && currentRight !== next) map.removeLayer(currentRight);
                currentRight = next;
                if (swipeControl) swipeControl.setRightLayers(currentRight);
            }

            return true;
        }

        function bindLayerButtons(selector, side) {
            document.querySelectorAll(selector).forEach(button => {
                button.addEventListener('click', () => {
                    if (!updateLayer(side, button.dataset.layer)) return;
                    document.querySelectorAll(selector).forEach(item => item.classList.remove('active'));
                    button.classList.add('active');
                });
            });
        }

        bindLayerButtons('.left-btn', 'left');
        bindLayerButtons('.right-btn', 'right');

        // Fetch and process 1937 historical aerial image
        fetch('image00002_powered_by_soar.tiff')
            .then(response => {
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return response.arrayBuffer();
            })
            .then(arrayBuffer => parseGeoraster(arrayBuffer))
            .then(georaster => {
                const noDataValue = georaster.noDataValue;

                historicalLayer = new GeoRasterLayer({
                    georaster,
                    opacity: 1,
                    resolution: 256,
                    pixelValuesToColorFn: values => {
                        const pixelValue = values[0];
                        if (
                            !Number.isFinite(pixelValue) ||
                            pixelValue < 0 ||
                            pixelValue === 256 ||
                            (Number.isFinite(noDataValue) && pixelValue === noDataValue)
                        ) {
                            return null;
                        }
                        const val = Math.max(0, Math.min(255, Math.round(pixelValue)));
                        return `rgb(${val}, ${val}, ${val})`;
                    }
                });

                // FIX 2: Add TIFF to map and initialize the swipe tool ONLY after it finishes loading.
                historicalLayer.addTo(map);
                currentRight = historicalLayer;

                swipeControl = L.control.sideBySide(currentLeft, currentRight).addTo(map);

                const bounds = historicalLayer.getBounds();
                if (bounds && bounds.isValid()) {
                    map.fitBounds(bounds);
                }
            })
            .catch(error => console.error('Error loading 1937 SOAR TIFF:', error));
    </script>
</body>
</html>
